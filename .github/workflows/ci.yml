name: test-and-package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])"
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Smoke test entry points and demo
        run: |
          specgap --help
          python -m specgap --version
          specgap demo --out "${{ runner.temp }}/specgap-demo"
