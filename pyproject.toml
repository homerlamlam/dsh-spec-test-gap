[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specgap"
version = "0.1.0"
description = "Offline-first evidence-backed requirements and implementation reconciliation for QA"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SpecGap Contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/homerlamlam/specgap"
Issues = "https://github.com/homerlamlam/specgap/issues"

[project.scripts]
specgap = "specgap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
